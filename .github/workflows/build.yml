name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (no cache)
        run: ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Verify APK (size, ABIs, signing schemes)
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "### APK size:"; ls -lh $APK; du -h $APK
          echo "### Native ABIs bundled:"
          unzip -l $APK | grep -o 'lib/[a-z0-9_-]*/' | sort -u
          echo "### Signing schemes:"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | head -1)
          $BT/apksigner verify --verbose $APK | head -8

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}